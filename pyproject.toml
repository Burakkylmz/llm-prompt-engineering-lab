[project]
name = "llm-prompt-engineering-lab"
version = "0.1.0"
description = "Prompt & Context Engineering training labs (Groq API) — Modul 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.32.0",
    "pydantic>=2.9.0",
    "jsonschema>=4.23.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_core", "src/labs"]

[project.scripts]
lab-runner = "lab_core.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: requires a real GROQ_API_KEY and makes network calls (excluded by default)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
